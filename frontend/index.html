<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini 3.8 Live Scaffold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <!-- Minimal Landing View: Only the entry button to launch the AI Assistant -->
    <main id="landing-view" class="landing">
      <div class="landing__content">
        <div class="landing__brand" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 2.5C12.8 7.5 16.5 11.2 21.5 12C16.5 12.8 12.8 16.5 12 21.5C11.2 16.5 7.5 12.8 2.5 12C7.5 11.2 11.2 7.5 12 2.5Z"
              fill="currentColor"
            />
          </svg>
        </div>
        <h1 class="landing__title">Gemini 3.8 Live Scaffold</h1>
        <p class="landing__subtitle">
          Asisten suara interaktif Bahasa Indonesia dengan layar dinamis real-time.
        </p>
        <button id="open-assistant-btn" type="button" class="btn-launch">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" x2="12" y1="19" y2="22" />
          </svg>
          <span>Buka Asisten AI</span>
        </button>
      </div>
    </main>

    <!-- Full-Screen 2-Panel AI Assistant Workspace -->
    <section
      id="assistant-overlay"
      class="assistant-overlay"
      aria-label="Asisten AI Gemini 3.8 Live"
      hidden
    >
      <!-- LEFT PANEL: Real-time Transcript & Voice Controls -->
      <aside class="panel panel--chat" aria-label="Transkrip Percakapan">
        <header class="panel-header">
          <div class="status-group">
            <span id="status-dot" class="status-dot" data-state="connecting"></span>
            <div class="status-meta">
              <span id="status-text" class="status-text">Menghubungkan...</span>
              <span id="voice-badge" class="voice-badge">Aoede • id-ID</span>
            </div>
          </div>

          <div class="header-actions">
            <button
              id="mute-btn"
              type="button"
              class="btn-control"
              aria-pressed="false"
              title="Bisukan atau aktifkan mikrofon"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" x2="12" y1="19" y2="22" />
              </svg>
              <span id="mute-label">Bisukan</span>
            </button>

            <button
              id="close-assistant-btn"
              type="button"
              class="btn-control btn-control--danger"
              title="Tutup Asisten AI"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
              <span>Tutup</span>
            </button>
          </div>
        </header>

        <div id="transcript-list" class="transcript-list" role="log" aria-live="polite"></div>

        <footer class="chat-footer">
          <div class="mic-bar" aria-hidden="true">
            <span class="mic-bar__label">Audio</span>
            <div class="mic-bar__track">
              <div id="mic-meter-fill" class="mic-bar__fill"></div>
            </div>
          </div>

          <form id="text-input-form" class="text-form" autocomplete="off">
            <input
              id="text-input"
              type="text"
              class="text-form__input"
              placeholder="Atau ketik pesan di sini..."
              aria-label="Ketik pesan untuk asisten"
            />
            <button type="submit" class="text-form__send" title="Kirim pesan">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m22 2-7 20-4-9-9-4Z" />
                <path d="M22 2 11 13" />
              </svg>
            </button>
          </form>
        </footer>
      </aside>

      <!-- RIGHT PANEL: Dynamic Canvas (Welcome / Search Results / Structured Info) -->
      <main class="panel panel--canvas" aria-label="Halaman Dinamis">
        <header class="panel-header panel-header--canvas">
          <div class="canvas-header-left">
            <span id="canvas-badge" class="canvas-badge">Halaman Utama</span>
          </div>
          <button id="canvas-reset-btn" type="button" class="btn-subtle" hidden>
            Kembali ke Sapaan
          </button>
        </header>

        <div id="canvas-content" class="canvas-content"></div>
      </main>
    </section>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
